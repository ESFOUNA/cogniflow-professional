name: Validation de Build CogniFlow

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  build-sur-windows:
    runs-on: windows-latest
    
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4
      
      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 3. Installer Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 4. Installer les dépendances (npm)
        run: npm install
      
      - name: 5. Construire l'application (Build)
        run: npm run tauri build
        
      # On ne fait plus de test de deep link.
      # Si la commande `build` se termine sans erreur, le test est un SUCCÈS.