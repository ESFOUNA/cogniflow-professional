name: Test et Validation de CogniFlow

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  test-sur-windows:
    runs-on: windows-latest
    
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4
      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 3. Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 4. Installer les dépendances (npm)
        run: npm install
      - name: 5. Construire l'application (Build)
        run: npm run tauri build -- --debug
      - name: 6. Installer l'application (.msi)
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/debug/bundle/msi -Filter *.msi | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList "/i", $msi.FullName, "/quiet", "/norestart" -Wait
        shell: powershell
      - name: 7. Tester le Lancement de l'Application
        run: |
          Write-Host "--- Début du Test de Lancement ---"
          # On cherche le chemin de l'exécutable dans le menu Démarrer
          $startMenuPath = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\ESFOUNA\cogniflow-professional.lnk"
          Write-Host "Chemin du raccourci: $startMenuPath"

          # On lance l'application directement via son raccourci
          Start-Process -FilePath $startMenuPath
          
          Write-Host "Attente de 10 secondes pour que l'application se lance..."
          Start-Sleep -Seconds 10
          
          # On cherche le processus
          $process = Get-Process -Name "cogniflow-professional" -ErrorAction SilentlyContinue
          if ($process) {
            Write-Host "✅ SUCCÈS : Le processus CogniFlow est en cours d'exécution !" -ForegroundColor Green
            Stop-Process -Name "cogniflow-professional" -Force
          } else {
            Write-Host "❌ ÉCHEC : Le processus CogniFlow n'a pas démarré après un lancement direct." -ForegroundColor Red
            exit 1
          }
        shell: powershell