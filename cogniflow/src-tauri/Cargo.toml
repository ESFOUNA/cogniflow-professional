[package]
name = "cogniflow"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "path-all", "fs-all", "shell-open", "dialog-all", "notification-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
